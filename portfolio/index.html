<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio – nasze stylizacje rzęs, brwi i efekty zabiegów | PerfectEye Katowice</title>
<meta name="description" content="Zobacz efekty naszej pracy: przedłużanie rzęs, laminacja, henna pudrowa, zabiegi na twarz przed i po. Salon PerfectEye, Katowice-Brynów.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.perfecteye.pl/portfolio/">
<link rel="icon" href="../zdjecia/favicon.svg" type="image/svg+xml">
<script src="../assets/head.js" data-root="../"></script>
<style>.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.gal figure{margin:0;border:1px solid var(--line);background:var(--bg3)}.gal .ph,.gal img{aspect-ratio:1/1;min-height:0;height:auto;width:100%;object-fit:cover}.gal figcaption{padding:12px 14px;font-size:14px;color:var(--muted)}.filtry{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:32px}.filtry button{background:none;border:1px solid var(--line3);color:var(--muted);font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;cursor:pointer}.filtry button.on{background:var(--gold-grad);color:#1A1307;font-weight:600;border-color:transparent}</style>
</head>
<body data-page="portfolio/">
<div id="chrome-top"></div>
<nav class="wrap crumbs" aria-label="Ścieżka"><a href="../">Strona główna</a> / <span style="color:var(--text)">Portfolio</span></nav>

<section class="section tight"><div class="wrap">
  <div class="head"><p class="eyebrow">Portfolio</p><h1 style="font-size:clamp(40px,6vw,64px)">Nasze stylizacje</h1><p class="muted">Zdjęcia naszych klientek, bez retuszu. Więcej na bieżąco na <a data-href-u="instagram" href="https://www.instagram.com/perfecteye.pl/" rel="noopener">Instagramie</a>.</p></div>
  <div class="filtry" role="tablist"><button class="on" data-f="">Wszystko</button><button data-f="rzesy">Rzęsy</button><button data-f="brwi">Brwi</button><button data-f="twarz">Twarz</button><button data-f="akademia">Akademia</button><button data-f="salon">Salon</button></div>
  <div class="gal" id="gal"></div>
</div></section>

<section class="band section center"><div class="wrap">
  <h2>Chcesz taki efekt?</h2>
  <p class="muted" style="margin:14px 0 28px">Wybierz termin online albo zadzwoń – pomożemy dobrać stylizację.</p>
  <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center"><a class="btn" data-href-u="booksy" href="https://perfecteye.booksy.com" data-conv="booksy" rel="noopener">Umów wizytę</a><a class="btn ghost" href="tel:+48600102689" data-conv="tel">600 102 689</a></div>
</div></section>

<div id="chrome-bottom"></div>
<script src="../assets/site.js"></script>
<script>
(async () => {
  const g = await PE.load('galeria');
  const render = f => {
    document.getElementById('gal').innerHTML = g.filter(x => !f || x.kategoria === f).map(x =>
      `<figure><img src="../${x.plik}" alt="${x.opis}" loading="lazy" onerror="this.outerHTML='<div class=ph>[${x.opis}]</div>'"><figcaption>${x.opis}</figcaption></figure>`).join('');
  };
  render('');
  document.querySelectorAll('.filtry button').forEach(b => b.onclick = () => { document.querySelectorAll('.filtry button').forEach(x => x.classList.remove('on')); b.classList.add('on'); render(b.dataset.f); });
})();
</script>
</body>
</html>
